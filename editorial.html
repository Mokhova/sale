<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9E8E6;font-family:'Onest',sans-serif;color:#161616;-webkit-font-smoothing:antialiased}
a{color:#161616;text-decoration:none}
.wrap{max-width:1400px;margin:0 auto;padding:28px 20px 60px}
header .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
h1{font-weight:500;font-size:clamp(40px,6.5vw,88px);line-height:1;letter-spacing:-.03em}
h1 span{color:rgba(22,22,22,.32)}
.tg{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.tg:hover{background:#161616;color:#fff}
.sub{margin:18px 0 0;font-size:14px;line-height:1.45;color:#5B5B58;max-width:360px}
.chips{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:#fff;margin-top:20px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:9px 18px;cursor:pointer;background:transparent;color:#161616;font-family:inherit;font-size:14px;font-weight:500;transition:.2s}
.chip.on{background:#161616;color:#fff}
.chip .c{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:999px;padding:0 5px;font-size:11px;font-weight:600;background:#EDECEA;color:#5B5B58}
.chip.on .c{background:#F4562A;color:#FFF4EF}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cat{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:999px;padding:9px 16px;cursor:pointer;background:#fff;color:#161616;font-family:inherit;font-size:13px;font-weight:500;transition:.2s}
.cat.on{background:#161616;color:#fff}
.cat i{font-size:15px}
.grid{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.stat{border-radius:24px;background:#F4562A;color:#FFF4EF;padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-height:420px}
.stat .n{font-weight:200;font-size:clamp(80px,9vw,140px);line-height:.9;letter-spacing:-.04em}
.stat .s{font-size:13px;color:rgba(255,244,239,.85);line-height:1.4}
.card{display:flex;flex-direction:column;background:#fff;border-radius:24px;overflow:hidden;animation:in .3s cubic-bezier(.16,1,.3,1) both}

.card .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 12px}
.card .hd .ct{font-size:12px;color:#6E6E6A;max-width:62%}
.card .hd .bd{font-size:12px;font-weight:600}
.bd.new{color:#D6440F}.bd.used{color:#6E6E6A}
.gal{position:relative;height:250px;background:#F0EFED;overflow:hidden;touch-action:pan-y}
.gal .track{display:flex;height:100%;transition:transform .35s cubic-bezier(.16,1,.3,1)}
.gal .track img{min-width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;z-index:2}
.gal:hover .nav{opacity:1}
.gal .nav:hover{background:#161616;color:#fff}
.gal .nav.prev{left:10px}.gal .nav.next{right:10px}
.gal .nav[disabled]{display:none}
.gal .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2}
.gal .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:.2s}
.gal .dots i.on{background:#fff;width:16px;border-radius:3px}
.gal .cnt{position:absolute;top:10px;right:10px;background:rgba(22,22,22,.55);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;z-index:2}
.bd-abs{position:absolute;top:10px;left:10px;z-index:2;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bd-abs.new{background:#F4562A;color:#fff}.bd-abs.used{background:rgba(255,255,255,.9);color:#161616}
.bod{display:flex;flex-direction:column;gap:10px;padding:16px 18px 18px;flex:1}
.bod h3{font-size:20px;font-weight:500;line-height:1.12;letter-spacing:-.02em}
.bod p{font-size:13px;line-height:1.45;color:#5B5B58}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.price{font-size:20px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.buy{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:12px 22px;cursor:pointer;background:#161616;color:#fff;font-family:inherit;font-size:14px;font-weight:500;transition:.2s}
.buy:hover{background:#E8501F}
.mp{font-size:12px;color:#6E6E6A;text-decoration:underline;text-underline-offset:3px}
.mp:hover{color:#E8501F}
footer{margin-top:48px;padding-top:22px;border-top:1px solid rgba(22,22,22,.12);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#5B5B58;font-size:13px}
footer a{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#161616;color:#fff;border-radius:999px;padding:13px 26px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(22,22,22,.25);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,-4px)}
@media(max-width:600px){.gal .nav{opacity:1;width:32px;height:32px}}
</style>
</head>

. Б/у.", "price": "300 ₽", "imgs": ["img/p095_1.jpg", "img/p095_2.jpg", "img/p095_3.jpg", "img/p095_4.jpg"], "link": "https://www.ozon.ru/search/?text=Rocket%20Science%20for%20babies%20Chris%20Ferrie"}];
const ICONS={all:'ph-squares-four','Игрушки':'ph-puzzle-piece','Развивашки':'ph-shapes','Книги':'ph-book-open','Одежда детская':'ph-baby','Одежда взрослая':'ph-coat-hanger','Обувь':'ph-sneaker','Гигиена':'ph-drop','Детская ванна':'ph-bathtub','Для питомцев':'ph-paw-print','Для дома':'ph-house-line','Техника':'ph-plug','Праздник':'ph-balloon','Медицина':'ph-first-aid-kit'};
let cat='all', cond='all';
const cats=['all',...[...new Set(PRODUCTS.map(p=>p.cat))]];
const conds=[['all','Все'],['новый','Новые'],['б/у','Б/у']];

function filtered(){return PRODUCTS.filter(p=>(cat==='all'||p.cat===cat)&&(cond==='all'||p.badge===cond));}

function renderChips(){
  const cc=document.getElementById('conds'); cc.innerHTML='';
  conds.forEach(([v,l])=>{
    const n=v==='all'?PRODUCTS.length:PRODUCTS.filter(p=>p.badge===v).length;
    const b=document.createElement('button'); b.className='chip'+(cond===v?' on':'');
    b.innerHTML=l+' <span class="c">'+n+'</span>';
    b.onclick=()=>{cond=v;render();}; cc.appendChild(b);
  });
  const ct=document.getElementById('cats'); ct.innerHTML='';
  cats.forEach(c=>{
    const b=document.createElement('button'); b.className='cat'+(cat===c?' on':'');
    b.innerHTML='<i class="ph '+(ICONS[c]||'ph-tag')+'"></i>'+(c==='all'?'Все':c);
    b.onclick=()=>{cat=c;render();}; ct.appendChild(b);
  });
}

function card(p,idx){
  const used=p.badge==='новый'?'new':'used';
  const el=document.createElement('article'); el.className='card';
  const multi=p.imgs.length>1;
  el.innerHTML=`
    <div class="hd"><span class="ct">${p.cat}</span><span class="bd ${used}">${p.badge}</span></div>
    <div class="gal" data-i="0">
      <span class="bd-abs ${used}">${p.badge}</span>
      ${multi?`<span class="cnt"><i class="ph ph-images" style="font-size:12px"></i> ${p.imgs.length}</span>`:''}
      <div class="track">${p.imgs.map(s=>`<img src="${s}" loading="lazy" alt="${p.title.replace(/"/g,'&quot;')}">`).join('')}</div>
      ${multi?`<button class="nav prev" disabled><i class="ph ph-caret-left"></i></button><button class="nav next"><i class="ph ph-caret-right"></i></button>
      <div class="dots">${p.imgs.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}
    </div>
    <div class="bod">
      <h3>${p.title}</h3>
      <p>${p.desc}</p>
      <div class="row"><span class="price">${p.price}</span>
        <button class="buy">Купить</button></div>
      <a class="mp" href="${p.link}" target="_blank">Такой&nbsp;же товар на&nbsp;маркетплейсе ↗</a>
    </div>`;
  const gal=el.querySelector('.gal');
  if(multi){
    const track=gal.querySelector('.track');
    const dots=[...gal.querySelectorAll('.dots i')];
    const prev=gal.querySelector('.prev'), next=gal.querySelector('.next');
    const go=i=>{i=Math.max(0,Math.min(p.imgs.length-1,i));gal.dataset.i=i;
      track.style.transform=`translateX(${-i*100}%)`;
      dots.forEach((d,k)=>d.classList.toggle('on',k===i));
      prev.disabled=i===0; next.disabled=i===p.imgs.length-1;};
    prev.onclick=e=>{e.stopPropagation();go(+gal.dataset.i-1);};
    next.onclick=e=>{e.stopPropagation();go(+gal.dataset.i+1);};
    let sx=0,dx=0,drag=false;
    gal.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;drag=true;},{passive:true});
    gal.addEventListener('touchmove',e=>{if(drag)dx=e.touches[0].clientX-sx;},{passive:true});
    gal.addEventListener('touchend',()=>{if(Math.abs(dx)>40)go(+gal.dataset.i+(dx<0?1:-1));dx=0;drag=false;});
  }
  el.querySelector('.buy').onclick=()=>buy(p);
  return el;
}

function buy(p){
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      const png=fetch(p.imgs[0]).then(r=>r.blob()).then(b=>createImageBitmap(b)).then(bmp=>{
        const cv=document.createElement('canvas');cv.width=bmp.width;cv.height=bmp.height;
        cv.getContext('2d').drawImage(bmp,0,0);return new Promise(r=>cv.toBlob(r,'image/png'));});
      navigator.clipboard.write([new ClipboardItem({'image/png':png})]).then(()=>showToast('Фото скопировано — вставьте в чат Telegram (Ctrl+V)')).catch(()=>{});
    }
  }catch(e){}
  const msg='Здравствуйте! Хочу купить: «'+p.title+'» за '+p.price+'.';
  window.open('https://t.me/mokhova?text='+encodeURIComponent(msg),'_blank');
}
let tt;
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3500);}

function render(){
  renderChips();
  const g=document.getElementById('grid'); g.innerHTML='';
  const list=filtered();
  const stat=document.createElement('div'); stat.className='stat';
  stat.innerHTML=`<div style="display:flex;justify-content:space-between"><span class="s">вещей сейчас<br>в&nbsp;продаже</span><i class="ph ph-arrow-up-right" style="font-size:20px;color:rgba(255,244,239,.85)"></i></div><div class="n">${list.length}</div><span class="s">фото настоящие, состояние описано честно</span>`;
  g.appendChild(stat);
  if(!list.length){const e=document.createElement('p');e.style.cssText='color:#5B5B58;margin:32px 4px';e.textContent='В этой категории нет товаров с таким состоянием.';g.appendChild(e);return;}
  list.forEach((p,i)=>g.appendChild(card(p,i)));
}
render();
</script>
</body>

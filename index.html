let cat='all', cond='all';
const cats=['all',...[...new Set(PRODUCTS.map(p=>p.cat))]];
const conds=[['all','Все'],['новый','Новые'],['б/у','Б/у']];
const ICONS={all:'ph-squares-four','Игрушки':'ph-puzzle-piece','Развивашки':'ph-shapes','Книги':'ph-book-open','Одежда детская':'ph-baby','Одежда взрослая':'ph-coat-hanger','Обувь':'ph-sneaker','Гигиена':'ph-drop','Детская ванна':'ph-bathtub','Для питомцев':'ph-paw-print','Для дома':'ph-house-line','Техника':'ph-plug','Праздник':'ph-balloon','Медицина':'ph-first-aid-kit'};
function filtered(){return PRODUCTS.filter(p=>(cat==='all'||p.cat===cat)&&(cond==='all'||p.badge===cond));}
function renderChips(){
  const cc=document.getElementById('conds'); cc.innerHTML='';
  conds.forEach(([v,l])=>{
    const n=v==='all'?PRODUCTS.length:PRODUCTS.filter(p=>p.badge===v).length;
    const b=document.createElement('button'); b.className='chip'+(cond===v?' on':'');
    b.innerHTML=l+' <span class="c">'+n+'</span>';
    b.onclick=()=>{cond=v;render();}; cc.appendChild(b);
  });
  const ct=document.getElementById('cats'); ct.innerHTML='';
  cats.forEach(c=>{
    const n=c==='all'?PRODUCTS.length:PRODUCTS.filter(p=>p.cat===c).length;
    const b=document.createElement('button'); b.className='cat'+(cat===c?' on':'');
    b.innerHTML=(c==='all'?'Все категории':c)+' <span class="c">'+n+'</span>';
    b.onclick=()=>{cat=c;render();}; ct.appendChild(b);
  });
}
function card(p){
  const el=document.createElement('article'); el.className='card';
  const multi=p.imgs.length>1;
  const badge=p.badge==='новый'?'Новый':'Б/У';
  el.innerHTML=`
    <div class="chiprow">
      <span class="pill pcat">${p.cat}</span>
      <span class="pill pcond">${badge}</span>
      ${multi?`<span class="pill pr">${p.imgs.length} фото</span>`:''}
    </div>
    <div class="trow"><h3>${p.title}</h3><span class="price">${p.price}</span></div>
    <div class="dwrap">
      <div class="dcol">${p.desc?`<span class="desc">${p.desc}</span><span class="hint"><i class="ph ph-arrow-down"></i></span>`:`<a class="mp" href="${p.link}" target="_blank">${p.linktext || 'Такой&nbsp;же товар на&nbsp;маркетплейсе'} ↗</a>`}</div>
      <div class="dexp"><p class="desc">${p.desc}</p><a class="mp" href="${p.link}" target="_blank" onclick="event.stopPropagation()">${p.linktext || 'Такой&nbsp;же товар на&nbsp;маркетплейсе'} ↗</a><div class="up"><i class="ph ph-arrow-up"></i></div></div>
    </div>
    <div class="media">
      <div class="gal" data-i="0">
        <div class="track">${p.imgs.map(s=>`<img src="${s}" loading="lazy" alt="${p.title.replace(/"/g,'&quot;')}">`).join('')}</div>
        ${multi?`<button class="nav prev" disabled><i class="ph ph-caret-left"></i></button><button class="nav next"><i class="ph ph-caret-right"></i></button>
        <div class="dots">${p.imgs.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}
      </div>
    </div>
    <button class="buy"><i class="ph-fill ph-paper-plane-tilt"></i>Купить</button>`;
  // галерея
  const gal=el.querySelector('.gal');
  if(multi){
    const track=gal.querySelector('.track');
    const dots=[...gal.querySelectorAll('.dots i')];
    const prev=gal.querySelector('.prev'), next=gal.querySelector('.next');
    const go=i=>{i=Math.max(0,Math.min(p.imgs.length-1,i));gal.dataset.i=i;
      track.style.transform=`translateX(${-i*100}%)`;
      dots.forEach((d,k)=>d.classList.toggle('on',k===i));
      prev.disabled=i===0; next.disabled=i===p.imgs.length-1;};
    prev.onclick=e=>{e.stopPropagation();go(+gal.dataset.i-1);};
    next.onclick=e=>{e.stopPropagation();go(+gal.dataset.i+1);};
    let sx=0,dx=0,drag=false;
    gal.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;drag=true;},{passive:true});
    gal.addEventListener('touchmove',e=>{if(drag)dx=e.touches[0].clientX-sx;},{passive:true});
    gal.addEventListener('touchend',()=>{if(Math.abs(dx)>40){go(+gal.dataset.i+(dx<0?1:-1));gal.dataset.sw=Date.now();}dx=0;drag=false;});
  }
  gal.querySelectorAll('.track img').forEach((im,idx)=>{
    im.addEventListener('click',()=>{ if(Date.now()-(+gal.dataset.sw||0)<400) return; openLB(p.imgs, idx); });
  });
  // описание: если есть — разворачивается (ссылка внутри), если нет — вместо него ссылка
  const dcol=el.querySelector('.dcol');
  if(p.desc){
    el.classList.add('of');
    dcol.onclick=()=>el.classList.add('exp');
    el.querySelector('.dexp').onclick=()=>el.classList.remove('exp');
  }
  el.querySelector('.pcat').onclick=()=>{cat=p.cat;render();};
  el.querySelector('.pcond').onclick=()=>{cond=p.badge;render();};
  el.querySelector('.buy').onclick=()=>buy(p);
  return el;
}
function buy(p){
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      const png=fetch(p.imgs[0]).then(r=>r.blob()).then(b=>createImageBitmap(b)).then(bmp=>{
        const cv=document.createElement('canvas');cv.width=bmp.width;cv.height=bmp.height;
        cv.getContext('2d').drawImage(bmp,0,0);return new Promise(r=>cv.toBlob(r,'image/png'));});
      navigator.clipboard.write([new ClipboardItem({'image/png':png})]).then(()=>showToast('Фото скопировано — вставьте в чат Telegram (Ctrl+V)')).catch(()=>{});
    }
  }catch(e){}
  window.open('https://t.me/mokhova?text='+encodeURIComponent('Здравствуйте! Хочу купить: «'+p.title+'» за '+p.price+'.'),'_blank');
}
const totop=document.getElementById('totop');
totop.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll',()=>totop.classList.toggle('on',window.scrollY>400),{passive:true});
const lb=document.getElementById('lb');
const lbImg=lb.querySelector('img'), lbPrev=lb.querySelector('.lbprev'), lbNext=lb.querySelector('.lbnext');
let lbImgs=[], lbI=0;
function lbShow(){lbImg.src=lbImgs[lbI];const m=lbImgs.length>1;lbPrev.style.display=m&&lbI>0?'flex':'none';lbNext.style.display=m&&lbI<lbImgs.length-1?'flex':'none';}
function lbGo(d){const n=Math.max(0,Math.min(lbImgs.length-1,lbI+d));if(n!==lbI){lbI=n;lbShow();}}
function openLB(imgs,i){lbImgs=Array.isArray(imgs)?imgs:[imgs];lbI=i||0;lbShow();lb.classList.add('on');document.body.style.overflow='hidden';}
function closeLB(){lb.classList.remove('on');document.body.style.overflow='';}
lb.addEventListener('click',e=>{ if(e.target===lb) closeLB(); });
lb.querySelector('.lbx').addEventListener('click',e=>{e.stopPropagation();closeLB();});
lbPrev.addEventListener('click',e=>{e.stopPropagation();lbGo(-1);});
lbNext.addEventListener('click',e=>{e.stopPropagation();lbGo(1);});
document.addEventListener('keydown',e=>{ if(!lb.classList.contains('on'))return; if(e.key==='Escape')closeLB(); else if(e.key==='ArrowLeft')lbGo(-1); else if(e.key==='ArrowRight')lbGo(1); });
let lsx=0,ldx=0,ldrag=false;
lb.addEventListener('touchstart',e=>{lsx=e.touches[0].clientX;ldx=0;ldrag=true;},{passive:true});
lb.addEventListener('touchmove',e=>{if(ldrag)ldx=e.touches[0].clientX-lsx;},{passive:true});
lb.addEventListener('touchend',()=>{if(ldrag&&Math.abs(ldx)>45)lbGo(ldx<0?1:-1);ldrag=false;});
let tt;
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3500);}
let tmpCat='all',tmpCond='all';
function syncMobile(){
  const seg=document.getElementById('mseg'); if(!seg) return; seg.innerHTML='';
  conds.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.className=cond===v?'on':'';b.onclick=()=>{cond=v;render();};seg.appendChild(b);});
  const n=(cat!=='all'?1:0)+(cond!=='all'?1:0);
  const badge=document.getElementById('mfcount');badge.textContent=n;badge.classList.toggle('on',n>0);
}
function buildSheet(){
  const sc=document.getElementById('mscats');sc.innerHTML='';
  cats.forEach(c=>{const b=document.createElement('button');b.className='mchip'+(tmpCat===c?' on':'');b.textContent=c==='all'?'Все категории':c;b.onclick=()=>{tmpCat=c;[...sc.children].forEach((x,i)=>x.classList.toggle('on',cats[i]===tmpCat));};sc.appendChild(b);});
  const so=document.getElementById('msconds');so.innerHTML='';
  conds.forEach(([v,l])=>{const b=document.createElement('button');b.className='mchip'+(tmpCond===v?' on':'');b.textContent=l;b.onclick=()=>{tmpCond=v;[...so.children].forEach((x,i)=>x.classList.toggle('on',conds[i][0]===tmpCond));};so.appendChild(b);});
}
function openSheet(){tmpCat=cat;tmpCond=cond;buildSheet();document.getElementById('mscrim').classList.add('on');document.getElementById('msheet').classList.add('on');document.body.style.overflow='hidden';}
function closeSheet(){document.getElementById('mscrim').classList.remove('on');document.getElementById('msheet').classList.remove('on');document.body.style.overflow='';}
document.getElementById('mopenf').onclick=openSheet;
document.getElementById('mscrim').onclick=closeSheet;
document.getElementById('mapply').onclick=()=>{cat=tmpCat;cond=tmpCond;render();closeSheet();};
document.getElementById('mreset').onclick=()=>{tmpCat='all';tmpCond='all';buildSheet();};
function render(){
  renderChips();
  syncMobile();
  const g=document.getElementById('grid'); g.innerHTML='';
  const list=filtered();
  
  if(!list.length){const e=document.createElement('p');e.className='empty';e.textContent='В этой категории нет товаров с таким состоянием.';g.appendChild(e);return;}
  list.forEach(p=>g.appendChild(card(p)));
}
render();
</script>
